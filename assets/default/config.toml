[shortcut]
# Keys are the character typed (not the physical position), so they follow the keyboard layout
# Shortcut to save crop image shown on screen
save_crop_image = { Character = "p" }
# Shortcut modifier for local zoom (hold + click to zoom individual image)
local_zoom_modifier = { Character = "z" }
# Shortcut modifier for local rotation (hold + click to rotate individual image)
local_rotate_modifier = { Character = "e" }
# Shortcut to toggle the multicursor
switch_cursor = { Character = "c" }
# Shortcut to switch between layout (grid, stack; horizontal ...)
switch_layout = { Character = "l" }
# Shortcut to rotate all images
rotate_images = { Character = "r" }
# Shortcut to toggle add mode (dropped images are added instead of replacing)
add_images = { Character = "a" }

[text]
# Color of the image name shown in the corner
font_color = { "Srgba"= { "red"= 0.0, "green"= 1.0, "blue"= 0.0, "alpha"= 1.0}}
# Font size of the image name
font_size = 16.0

[hdr]
enabled = false

[misc]
# Enable the zoom on mouse scroll
scroll_behavior = "None"
# Width of the grid (0: auto)
grid_width = 0
# Texture interpolation mode (Nearest or Bilinear)
sampler_mode = "Nearest"

[color]
# Color space of the physical screen; images are converted to it at load.
# One of: Srgb, AdobeRgb, DisplayP3, Rec2020
screen_color_space = "Srgb"